# Builds the game with Vite and publishes the whole site to GitHub Pages.
# Pages cannot serve the game's TypeScript source directly, so it must deploy
# the built output. Requires Settings > Pages > Source set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The build stamp every analytics event carries (tools/buildStamp.mjs); the version comes from releases.json.
      - run: npm run build
        env:
          DOD_BUILD_COMMIT: ${{ github.sha }}
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html characters.html privacypolicy.html whatsnew.html releases.json favicon.svg CNAME _site/
          cp -r site characters audio stages _site/
          # The built game: dist/Game/index.html plus its bundled assets.
          cp -r dist/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
