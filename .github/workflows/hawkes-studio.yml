name: Hawkes Studio

# Tells Hawkes Studio (studio.hawkesgen.com) about every push to beta or main, so it takes it from there:
# - beta: the beta site https://<product>.hawkesgen.com rebuilds (a Unity game is built on the build server).
# - main: going live. GitHub Pages publishes web sites itself; for a Unity game Studio publishes the build to its
#   website repo. Studio records the deploy and playtests the live site.
# No secrets: the workflow proves which repo and branch it is with GitHub's signed OIDC token.

on:
  push:
    branches: [beta, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: hawkes-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tell Hawkes Studio
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://studio.hawkesgen.com" | jq -r .value)
          curl -sS --fail-with-body --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST -H "Authorization: Bearer $token" https://studio.hawkesgen.com/api/hooks/github
