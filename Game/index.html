<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Play | Dose of Destruction</title>
  <meta name="theme-color" content="#100e0c">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/game/game.css">
</head>
<body>
  <canvas id="stage" aria-label="Game view"></canvas>

  <div id="hud" class="hud" hidden></div>

  <section id="menu" class="screen">
    <div class="panel">
      <a class="back" href="/">&larr; Site</a>
      <h1>Dose of Destruction</h1>

      <h2>Fighter</h2>
      <div id="roster" class="roster"></div>

      <div class="options">
        <label>Opponents
          <select id="opt-bots">
            <option value="0">Training dummy</option>
            <option value="1" selected>1 bot</option>
            <option value="2">2 bots</option>
            <option value="3">3 bots</option>
          </select>
        </label>
        <label>Bot level
          <select id="opt-level"></select>
        </label>
        <label>Stocks
          <select id="opt-stocks">
            <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button id="btn-fight" class="primary" type="button">Fight</button>
        <button class="secondary" type="button" disabled title="Online play with room codes is the next milestone">Online (soon)</button>
      </div>

      <details class="controls" open>
        <summary>Controls</summary>
        <div class="controls-grid">
          <div><h3>Keyboard</h3><dl id="keys-kb"></dl></div>
          <div><h3>Gamepad</h3><dl id="keys-pad"></dl></div>
        </div>
        <p class="hint">Press <kbd>H</kbd> in a match to show hitboxes.</p>
      </details>
    </div>
  </section>

  <section id="pause" class="screen" hidden>
    <div class="panel small">
      <h2>Paused</h2>
      <div class="actions column">
        <button id="btn-resume" class="primary" type="button">Resume</button>
        <button id="btn-quit" class="secondary" type="button">Quit to menu</button>
      </div>
    </div>
  </section>

  <section id="results" class="screen" hidden>
    <div class="panel">
      <h2 id="results-title">Game</h2>
      <table class="stats">
        <thead><tr><th>Player</th><th>KOs</th><th>Falls</th><th>Damage dealt</th></tr></thead>
        <tbody id="results-body"></tbody>
      </table>
      <div class="actions">
        <button id="btn-rematch" class="primary" type="button">Rematch</button>
        <button id="btn-menu" class="secondary" type="button">Change fighters</button>
      </div>
    </div>
  </section>

  <div id="loading" class="loading" hidden>Loading fighters&hellip;</div>

  <script type="module" src="../src/game/main.ts"></script>
</body>
</html>
