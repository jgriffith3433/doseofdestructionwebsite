<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Dance</title>
<meta name="description" content="Space Dance.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { color: #e8f0ff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.15) 0%, rgba(0,0,0,.6) 100%); transition: opacity .6s; z-index: 2; }
  #start.gone { opacity: 0; pointer-events: none; }
  #play { width: 96px; height: 96px; border-radius: 50%; border: 2px solid rgba(160,200,255,.85); background: rgba(20,60,160,.35);
    box-shadow: 0 0 40px rgba(80,140,255,.55), inset 0 0 20px rgba(120,170,255,.35); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .2s, background .2s; }
  #play:hover { transform: scale(1.06); background: rgba(40,90,210,.5); }
  #play svg { width: 38px; height: 38px; margin-left: 6px; fill: #eaf2ff; }
  #pause { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 13px; letter-spacing: .2em;
    color: rgba(232,240,255,.8); pointer-events: none; opacity: 0; transition: opacity .3s; z-index: 1; }
  #pause.on { opacity: 1; }
</style>
</head>
<body>
<video id="v" src="video.mp4" poster="poster.jpg" playsinline preload="metadata"></video>
<div id="pause">PAUSED</div>
<div id="start"><button id="play" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg></button></div>
<script>
const v = document.getElementById('v'), start = document.getElementById('start'), pause = document.getElementById('pause');
let playing = false;
function go() { start.classList.add('gone'); pause.classList.remove('on'); v.play().then(() => playing = true).catch(() => start.classList.remove('gone')); }
start.addEventListener('click', go);
v.addEventListener('click', () => { if (!playing) return; if (v.paused) { v.play(); pause.classList.remove('on'); } else { v.pause(); pause.classList.add('on'); } });
v.addEventListener('ended', () => { playing = false; v.currentTime = 0; start.classList.remove('gone'); });
addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); playing ? v.click() : go(); } });
</script>
</body>
</html>
