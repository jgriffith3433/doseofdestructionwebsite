<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Blast</title>
<meta name="description" content="The dust sphere over the island collapses and explodes. Birds, instruments and a town far away each feel it in turn.">
<meta name="theme-color" content="#000000">
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #d8d2c8; font: 500 17px/1.5 "Segoe UI", system-ui, sans-serif; }
  #play { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; font: 600 15px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: #f1e6d4; background: rgba(10, 8, 6, .6); border: 1px solid rgba(241, 230, 212, .5); border-radius: 999px; padding: 16px 30px; cursor: pointer; }
  #play:hover { background: rgba(40, 30, 20, .75); }
  #play:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A sphere of dust over an island collapses and explodes; the blast, a great wave and a storm cross the sea to a town"></canvas>
<button id="play" type="button">Play</button>
<div id="msg">This scene needs WebGL 2, and this browser does not have it turned on.</div>
<script type="module">
// The Blast. The dust sphere over the island pulls itself in and explodes. The film shows it many ways: the birds leave
// first, the instruments in a monitoring room pick it up, a town miles away starts to shake, then the blast itself from the
// sea, from the town, from the room and from far above, and after it the wave, the storm and what is left.
// WORLD TIME is b: seconds since the blast (negative before it). Every shot says which stretch of world time it shows,
// so the blast can be seen more than once. Everything in the world is worked out from b.
// THE SONG is song.mp3 beside this page. The blast lands on the song's big hit at 57.3 seconds.
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';
const SONG = 'song.mp3', BPM = 90, LENGTH = 121.79;
const VS = 330, VT = 110, CLOUDH = 1300;       // speed of the shock in the air, of the great wave, and the height of the cloud deck

const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' }); if (!renderer.capabilities.isWebGL2) throw 0; }
catch (e) { document.getElementById('msg').style.display = 'flex'; throw e; }
renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.autoClear = false;
const HDR = renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float') ? THREE.HalfFloatType : THREE.UnsignedByteType;

// ---- random numbers: one small texture for the GPU (red is green shifted, which gives 3D noise from one read)
let seed = 4242; const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const NS = 256, G = new Uint8Array(NS * NS), nd = new Uint8Array(NS * NS * 4);
for (let i = 0; i < NS * NS; i++) G[i] = (rnd() * 256) | 0;
for (let y = 0; y < NS; y++) for (let x = 0; x < NS; x++) { const i = (y * NS + x) * 4; nd[i + 1] = G[y * NS + x]; nd[i] = G[((y + 17) & 255) * NS + ((x + 37) & 255)]; nd[i + 2] = 0; nd[i + 3] = 255; }
const noiseTex = new THREE.DataTexture(nd, NS, NS, THREE.RGBAFormat); noiseTex.wrapS = noiseTex.wrapT = THREE.RepeatWrapping; noiseTex.magFilter = noiseTex.minFilter = THREE.LinearFilter; noiseTex.needsUpdate = true;
const vn = (x, y) => { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy), g = (a, b) => G[(b & 255) * NS + (a & 255)] / 255;
  const a = g(ix, iy), b = g(ix + 1, iy), c = g(ix, iy + 1), d = g(ix + 1, iy + 1); return a + (b - a) * ux + (c - a + (a - b - c + d) * ux) * uy; };
const fbmJ = (x, y, n) => { let s = 0, a = .5; for (let i = 0; i < n; i++) { s += a * vn(x, y); x = x * 2.03 + 17.3; y = y * 2.03 + 9.1; a *= .5; } return s; };
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v)), mix = (a, b, t) => a + (b - a) * t;

// ---- the land: the island under the sphere, the town's island miles away, and three islets
function islandH(x, z) { const r = Math.hypot(x, z), a = Math.atan2(z, x), rim = 232 + 56 * (fbmJ(x * .004 + 3, z * .004 + 7, 3) - .5) + 18 * Math.sin(a * 3 + 1) + 10 * Math.sin(a * 5 + 2);
  const t = 1 - r / rim; let h = t > 0 ? 26 * Math.pow(t, .75) : 60 * t; h += (fbmJ(x * .012, z * .012, 4) - .5) * 14 * sstep(0, .25, t);
  const pl = sstep(95, 45, r); return h * (1 - pl) + 9 * pl; }
const TOWN = { x: 2400, z: 900 }, TD = Math.hypot(TOWN.x, TOWN.z), FB = { x: -TOWN.x / TD, z: -TOWN.z / TD }, SB = { x: -FB.z, z: FB.x }, BAY = { x: FB.x * 205, z: FB.z * 205 }, AT = Math.atan2(TOWN.z, TOWN.x);
function townH(x, z) { const r = Math.hypot(x, z), a = Math.atan2(z, x), rim = 255 + 50 * (fbmJ(x * .004 + 31, z * .004 + 17, 3) - .5) + 16 * Math.sin(a * 2 + .6) + 9 * Math.sin(a * 5 + 1);
  const t = 1 - r / rim; let h = t > 0 ? 24 * Math.pow(t, .8) : 60 * t; h += (fbmJ(x * .012 + 9, z * .012 + 4, 4) - .5) * 10 * sstep(0, .25, t);
  const bx = x - BAY.x, bz = z - BAY.z; h -= 26 * Math.exp(-(bx * bx + bz * bz) / (62 * 62)); return Math.max(h, -60); }
const ISLETS = [[1350, -250, 95, 16], [-1500, 1300, 130, 22], [700, -2100, 150, 26]];
const isletH = (x, z, I) => { const t = 1 - Math.hypot(x - I[0], z - I[1]) / I[2]; return t > 0 ? I[3] * Math.pow(t, .75) : Math.max(60 * t, -60); };
const landH = (x, z, sink) => { let h = Math.max(islandH(x, z), -60) - (sink || 0); h = Math.max(h, townH(x - TOWN.x, z - TOWN.z)); for (const I of ISLETS) h = Math.max(h, isletH(x, z, I)); return h; };
const bake = (f, size) => { const IN = 256, d = new Float32Array(IN * IN * 4); for (let j = 0; j < IN; j++) for (let i = 0; i < IN; i++) { const k = (j * IN + i) * 4; d[k] = f((i + .5) / IN * size - size / 2, (j + .5) / IN * size - size / 2); d[k + 3] = 1; }
  const t = new THREE.DataTexture(d, IN, IN, THREE.RGBAFormat, THREE.FloatType); t.magFilter = t.minFilter = renderer.extensions.has('OES_texture_float_linear') ? THREE.LinearFilter : THREE.NearestFilter; t.needsUpdate = true; return t; };
const islTex = bake(islandH, 1200), islTex2 = bake(townH, 800);

// ---- the world at world time b
const tr = (b) => b >= 0 ? 1 : clamp(Math.exp((b + 1) / 10), 0, 1);                 // the slow shaking that builds before the blast
function world(b) { const s = Math.max(b, 0), pre = b < 0;
  const Rs = pre ? Math.max(.03, 1 - .86 * Math.pow(sstep(-30, -.3, b), 1.5) - .11 * sstep(-.3, 0, b)) : .03;     // the sphere pulling in
  const charge = pre ? 14 * Math.pow(tr(b), 2.2) : 0, spin = .5 * b + (b > -30 ? .06 * Math.pow(Math.min(b, 0) + 30, 2) : 0);
  const Rc = 40 + 560 * (1 - Math.exp(-s * .6)) + 14 * s, Yc = 62 + 2100 * (1 - Math.exp(-Math.max(s - 1.2, 0) / 16)), heat = Math.exp(-s * .2), rb = 150 + 900 * (1 - Math.exp(-s / 7));
  const fade = 1 - sstep(42, 75, s), storm = sstep(5, 45, b), rst = 400 + 150 * Math.max(b - 4, 0), f0 = Math.exp(-s * 3), f1 = Math.exp(-s * .25) * fade;
  const fire = pre ? [charge * .02, charge * .014, charge * .008] : [60 * f0 + 8 * f1, 57 * f0 + 4 * f1, 54 * f0 + 1.44 * f1];
  return { b, pre, Rs, charge, spin, Rc, Yc, heat, rb, fade, storm, rst, fire, fireY: pre ? 62 : Math.max(62, Yc * .8), trem: pre ? tr(b) : Math.exp(-s * .3),
    sink: 60 * sstep(.5, 12, b), rot: .03 * (b + 100) + .06 * Math.max(b - 5, 0) * sstep(5, 40, b) }; }
let W = world(-75);
const tsu = (r, b) => { if (b < 1) return 0; const x = VT * (b - 1) - r, A = mix(78, 54, sstep(300, 2600, r)) * sstep(0, 260, r);
  const crest = sstep(0, 30, x) * Math.exp(-Math.max(x - 30, 0) / 170), plat = .55 * sstep(0, 220, x) * Math.exp(-Math.max(x, 0) / 9000), draw = -.16 * sstep(-520, -60, x) * (1 - sstep(-60, 0, x));
  return A * (Math.max(crest, plat) + draw); };
const seaH = (x, z, t) => { const st = W.storm; let h = 1.5 * Math.sin(x * .062 + z * .031 + t * .9) + .95 * Math.sin(-x * .04 + z * .105 + t * 1.25) + .55 * Math.sin(x * .17 - z * .11 + t * 1.8) + .3 * Math.sin(x * .21 + z * .30 + t * 2.6);
  return h * (1 + 2.2 * st) + st * (7 * Math.sin(x * .011 + z * .019 + t * .7) + 5 * Math.sin(-x * .023 + z * .009 + t * .9)) + tsu(Math.hypot(x, z), W.b) + 6 * st; };

const SUN = new THREE.Vector3(-.55, .2, -.62).normalize(), STAGE_Y = 9, v3 = () => ({ value: new THREE.Vector3() }), f1 = (v) => ({ value: v || 0 });
const U = { uNoise: { value: noiseTex }, uIsl: { value: islTex }, uIsl2: { value: islTex2 }, uTime: f1(), uB: f1(-75), uSun: { value: SUN }, uPulse: f1(), uL0: v3(), uL1: v3(), uL2: v3(), uFlash: f1(), uFlashPos: v3(),
  uStorm: f1(), uSpin: f1(), uRs: f1(1), uCharge: f1(), uFire: v3(), uFireP: v3(), uFireD: v3(), uBl: { value: new THREE.Vector4() }, uTrem: f1(), uRot: f1(), uRst: f1(400), uSink: f1() };

const COMMON = `
uniform sampler2D uNoise; uniform sampler2D uIsl; uniform sampler2D uIsl2; uniform float uTime, uB, uPulse, uFlash, uStorm, uSpin, uRs, uCharge, uTrem, uRot, uRst, uSink;
uniform vec3 uSun, uL0, uL1, uL2, uFlashPos, uFire, uFireP, uFireD; uniform vec4 uBl;
const vec3 C=vec3(0.,62.,0.); const float R=58., VS=${VS}., VT=${VT}., CLOUDH=${CLOUDH}.;
const vec3 SUNC=vec3(1.,.50,.22)*2.7, AMB=vec3(.10,.135,.22);
#define SUNK (SUNC*(1.-.88*uStorm))
const vec3 LP0=vec3(-9.,26.,-4.), LP1=vec3(9.,26.,-4.), LP2=vec3(0.,29.,6.);
const vec2 TOWNC=vec2(${TOWN.x}.,${TOWN.z}.);
float n3(vec3 x){ vec3 p=floor(x), f=fract(x); f=f*f*(3.-2.*f); vec2 uv=(p.xy+vec2(37.,17.)*p.z)+f.xy; vec2 rg=textureLod(uNoise,(uv+.5)/256.,0.).yx; return mix(rg.x,rg.y,f.z); }
float n2(vec2 x){ vec2 p=floor(x), f=fract(x); f=f*f*(3.-2.*f); return textureLod(uNoise,(p+f+.5)/256.,0.).y; }
float fbm2(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*n2(p); p=vec2(1.62*p.x-1.21*p.y, 1.21*p.x+1.62*p.y)+vec2(17.3,9.1); a*=.5; } return s; }
float fbm3(vec3 p){ return .5*n3(p)+.25*n3(p*2.02+7.1)+.125*n3(p*4.1+3.3); }
vec3 rotY(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(c*p.x-s*p.z, p.y, s*p.x+c*p.z); }
vec3 rod(vec3 v, vec3 k, float a){ return v*cos(a)+cross(k,v)*sin(a)+k*dot(k,v)*(1.-cos(a)); }
float islet(vec2 p, vec4 I){ float t=1.-length(p-I.xy)/I.z; return t>0. ? I.w*pow(t,.75) : max(60.*t,-60.); }
float islH(vec2 p){ float h=-60.; vec2 uv=p/1200.+.5; if(uv.x>0.&&uv.x<1.&&uv.y>0.&&uv.y<1.) h=max(textureLod(uIsl,uv,0.).x,-60.)-uSink;
  uv=(p-TOWNC)/800.+.5; if(uv.x>0.&&uv.x<1.&&uv.y>0.&&uv.y<1.) h=max(h,textureLod(uIsl2,uv,0.).x);
  ${ISLETS.map(I => `h=max(h,islet(p,vec4(${I.map(v => v.toFixed(1)).join(',')})));`).join(' ')} return h; }
// the great wave: the sea draws back, a wall of water follows, and the sea stays high behind it
float tsu(float r){ if(uB<1.) return 0.; float x=VT*(uB-1.)-r, A=mix(78.,54.,smoothstep(300.,2600.,r))*smoothstep(0.,260.,r);
  float crest=smoothstep(0.,30.,x)*exp(-max(x-30.,0.)/170.), plat=.55*smoothstep(0.,220.,x)*exp(-max(x,0.)/9000.), draw=-.16*smoothstep(-520.,-60.,x)*(1.-smoothstep(-60.,0.,x));
  return A*(max(crest,plat)+draw); }
float windW(vec2 p){ float t=uTime; return (1.5*sin(dot(p,vec2(.062,.031))+t*.9)+.95*sin(dot(p,vec2(-.04,.105))+t*1.25)+.55*sin(dot(p,vec2(.17,-.11))+t*1.8)+.3*sin(dot(p,vec2(.21,.30))+t*2.6)
    +.24*sin(dot(p,vec2(.55,.33))+t*3.4)+.17*sin(dot(p,vec2(-.42,.71))+t*4.1))*(1.+2.2*uStorm); }
float waveH(vec2 p){ float r=length(p), k=.18+.82*smoothstep(0.,14.,-islH(p)), t=uTime;
  return windW(p)*k+uStorm*(7.*sin(dot(p,vec2(.011,.019))+t*.7)+5.*sin(dot(p,vec2(-.023,.009))+t*.9))+tsu(r)+6.*uStorm; }
// before the blast the sphere blocks the low sun: everything behind it sits in a long soft shadow
float sphShadow(vec3 p){ if(uB>0.) return 1.; float RR=R*uRs; vec3 oc=p-C; float b=dot(oc,uSun); if(b>0.) return 1.; return mix(.22,1.,smoothstep(RR*.75,RR*1.3,length(oc-uSun*b))); }
vec3 skyBase(vec3 d){ float y=max(d.y,0.), s=max(dot(d,uSun),0.);
  vec3 hor=mix(vec3(.085,.105,.17), vec3(1.0,.40,.13), pow(s,3.)); vec3 c=mix(hor, vec3(.014,.021,.045), pow(y,.36)); c+=vec3(1.,.40,.12)*pow(s,30.)*.8;
  vec3 st=mix(vec3(.050,.058,.068), vec3(.012,.015,.020), pow(y,.5))+vec3(.5,.2,.06)*pow(s,6.)*.2; c=mix(c, st, uStorm*.92);
  return c+uFire*(.006+.03*pow(max(dot(d,uFireD),0.),6.))+vec3(.5,.6,.8)*uFlash*.02; }
vec3 fogged(vec3 col, vec3 wp){ vec3 v=wp-cameraPosition; float dist=length(v); vec3 d=v/dist; float od=dist*min(1.,1500./max(abs(v.y),1.));
  return mix(col, skyBase(normalize(vec3(d.x,.015,d.z))), 1.-exp(-od*.00024*(1.+2.5*uStorm))); }
vec3 fireL(vec3 wp, vec3 N){ vec3 L=uFireP-wp; float d2=dot(L,L); return uFire*max(dot(N,L*inversesqrt(d2)),0.)*(4e5/(4e5+d2))*.35+vec3(.5,.6,.8)*uFlash*.05; }
`;

const scene = new THREE.Scene(), fx = new THREE.Scene(), camera = new THREE.PerspectiveCamera(45, 1, 1, 40000);

// ---- sky: dusk and a low sun (the cloud is drawn with the dust, so it can also be seen from above)
{ const m = new THREE.Mesh(new THREE.SphereGeometry(20000, 24, 16), new THREE.ShaderMaterial({ uniforms: U, side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*viewMatrix*vec4(position+cameraPosition,1.); gl_Position.z=gl_Position.w*.99995; }`,
    fragmentShader: COMMON + `varying vec3 vDir;
    void main(){ vec3 d=normalize(vDir); vec3 c=skyBase(normalize(vec3(d.x,max(d.y,0.),d.z))); float s=max(dot(d,uSun),0.);
      c+=vec3(1.,.72,.42)*(smoothstep(.9992,.9997,s)*22.+pow(s,500.)*2.5)*(1.-uStorm);
      gl_FragColor=vec4(c,1.); }` }));
  m.frustumCulled = false; m.renderOrder = -10; scene.add(m); }

// ---- sea: a grid that stays under the camera, lifted by the waves
let sea;
{ const pos = [], idx = [], RN = 170, SN = 96; for (let i = 0; i <= RN; i++) { const r = .42 * i * i; for (let j = 0; j < SN; j++) { const a = j / SN * 6.28318; pos.push(Math.cos(a) * r, 0, Math.sin(a) * r); } }
  for (let i = 0; i < RN; i++) for (let j = 0; j < SN; j++) { const a = i * SN + j, b = i * SN + (j + 1) % SN, c = a + SN, d = b + SN; idx.push(a, c, b, b, c, d); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  sea = new THREE.Mesh(g, new THREE.ShaderMaterial({ side: THREE.DoubleSide, uniforms: { ...U, uOrigin: { value: new THREE.Vector2() } },
    vertexShader: COMMON + `uniform vec2 uOrigin; varying vec3 vW; void main(){ vec2 p=position.xz+uOrigin; vW=vec3(p.x,waveH(p),p.y); gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.); }`,
    fragmentShader: COMMON + `varying vec3 vW;
    void main(){ vec2 p=vW.xz; float e=.9, h0=waveH(p); vec3 N=normalize(vec3(h0-waveH(p+vec2(e,0.)), e, h0-waveH(p+vec2(0.,e))));
      float dist=length(cameraPosition-vW), nf=1./(1.+dist*.004), r=length(p); vec2 q=p*.9+uTime*vec2(1.2,.5); float a=n2(q);
      vec2 q2=p*.28+uTime*vec2(-.5,.7); float a2=n2(q2);
      N=normalize(N+vec3(a-n2(q+vec2(1.3,0.)),0.,a-n2(q+vec2(0.,1.3)))*(1.+uStorm)*nf+vec3(a2-n2(q2+vec2(1.2,0.)),0.,a2-n2(q2+vec2(0.,1.2)))*.8*(.3+.7*nf));
      // the slow shaking shows on the water first: fine rings standing on the surface
      vec2 rd=p/max(r,1.); N=normalize(N+vec3(rd.x,0.,rd.y)*uTrem*step(uB,0.)*.5*nf*(cos(r*1.9-uTime*26.)+.6*cos(dot(p,vec2(1.3,-.9))*1.4+uTime*19.)));
      vec3 V=normalize(cameraPosition-vW), Rr=reflect(-V,N); Rr.y=abs(Rr.y)+.03; Rr=normalize(Rr);
      float land=islH(p), depth=-land, sh=sphShadow(vW);
      float fres=min(.03+.97*pow(1.-max(dot(V,N),0.),5.),.74);
      vec3 body=mix(vec3(.03,.21,.20), vec3(.008,.034,.058), 1.-exp(-max(depth,0.)*.05))*(.35+.65*sh); body=mix(body, vec3(.016,.034,.040), uStorm*.8);
      float over=smoothstep(-2.,4.,land); body=mix(body, vec3(.10,.085,.06), over*.7);
      vec3 col=mix(body, skyBase(Rr)*(.8+.25*a2), fres)+SUNK*pow(max(dot(Rr,uSun),0.),90.)*1.6*sh;
      vec3 Lf=normalize(uFireP-vW); col+=uFire*(pow(max(dot(Rr,Lf),0.),40.)*.55+.004);
      float wl=windW(p)/(1.+2.2*uStorm)*(.18+.82*smoothstep(0.,14.,depth));
      float foam=smoothstep(2.0-1.3*uStorm,3.2-1.3*uStorm,wl*.7+fbm2(p*.35+uTime*.4)*2.1+(fbm2(p*.021+3.)-.5)*2.6-.5)*.6;
      foam=max(foam, smoothstep(2.6,0.,depth+sin(depth*1.6-uTime*2.)*.6)*(.45+.55*fbm2(p*.6+uTime*.2)));
      foam=max(foam, smoothstep(.52,.78,fbm2(vec2(atan(p.y,p.x)*14.+r*.05+uTime*.8, r*.03)))*smoothstep(540.,235.,r)*.55*step(uB,0.));
      foam=max(foam, uStorm*.5*smoothstep(.5,.75,fbm2(p*vec2(.02,.09)+uTime*vec2(.6,.1))));
      if(uB>0.){ float xs=VS*uB-r, x=VT*(uB-1.)-r;      // the shock crossing the water, then the wave
        foam=max(foam, exp(-pow(xs/(9.+.012*r),2.))*exp(-uB*.14));
        foam=max(foam, .35*smoothstep(0.,60.,xs)*exp(-xs/300.)*exp(-uB*.2)*(.4+fbm2(p*.2)));
        if(uB>1.){ float tf=smoothstep(22.,64.,x)*exp(-max(x-64.,0.)/520.)*(.45+.55*fbm2(p*.05+uTime*.3)); float face=smoothstep(-2.,10.,x)*smoothstep(26.,12.,x)*smoothstep(.30,.62,fbm2(vec2(atan(p.y,p.x)*r*.045, x*.10-uTime*1.4)));
          foam=max(foam, max(tf, max(face*.8, smoothstep(14.,28.,x)*smoothstep(90.,36.,x)))); }
        foam=max(foam, over*(.25+.75*smoothstep(.3,.7,fbm2(p*.045+uTime*vec2(.5,.3))))); }
      col=mix(col, vec3(.86,.88,.88)*(.62+.6*fbm2(p*.11+uTime*.25))*(SUNK*(.10+.22*max(dot(N,uSun),0.))*sh+AMB*2.1*(1.-.45*uStorm)+uFire*.02+vec3(.6,.7,.9)*uFlash*.2), clamp(foam,0.,1.));
      gl_FragColor=vec4(fogged(col,vW),1.); }` }));
  sea.frustumCulled = false; scene.add(sea); }

// ---- land: one kind of ground for every island. The first is burnt and sinks; the others are scoured by the wave.
const landMesh = (hf, cx, cz, size, seg, kind) => { const g = new THREE.PlaneGeometry(size, size, seg, seg).rotateX(-Math.PI / 2), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); p.setXYZ(i, x + cx, hf(x, z), z + cz); } g.computeVertexNormals();
