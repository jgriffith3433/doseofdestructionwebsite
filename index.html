  .end { font-size: 15px; letter-spacing: .12em; line-height: 1.8; margin: 8px 0; }

  #mute { right: 14px; }
  #again { left: 14px; display: none; }
  .hint { font-size: 12px; color: var(--dim); letter-spacing: .1em; }

const ESC = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const RULE = '<div class="rule">' + '='.repeat(90) + '</div>';
let html = '<div class="big">I CAUGHT THE<br><em>BITCOIN ROBBER HACKER<br>TIME TRAVELER</em></div>'

  + '<div class="big" style="font-size:clamp(20px,4.4vw,30px)">E X T E N D E D &nbsp; C R E D I T S</div>'
  + '<div class="dates">SEPTEMBER 28, 2009 &mdash; MAY 16, 2015</div>' + RULE
  + '<p class="note">Everything below happened. The dates are real. He was there for all of it, and stole none of it successfully.</p>';
for (const [title, rows, cls] of SECTIONS) {
  html += `<section class="${cls || ''}"><h2>${ESC(title)}</h2>`;
  for (const [what, when, quip] of rows) {
    html += `<div class="row"><span class="what">${ESC(what)}</span><span class="dots"></span><span class="when">${ESC(when)}</span></div>`;
    if (quip) html += `<div class="quip">${ESC(quip)}</div>`;

}
html += '<div style="height:80px"></div>' + RULE
  + '<p class="end">NO BITCOINS WERE RECOVERED IN THE MAKING OF THIS TIMELINE.</p>'
  + '<p class="end">THE 10,000 BTC PIZZAS WERE EATEN. THEY ARE NOT COMING BACK.</p>'
  + '<p class="end">NO TIME TRAVELERS ATTENDED STEPHEN HAWKING\'S PARTY.<br>WE HAVE CHECKED THE GUEST LIST. IT IS STILL EMPTY.</p>'

  + '<p class="note" style="margin-top:60px">These credits end 158 days before October 21, 2015,<br>the day Marty McFly arrives in <i>Back to the Future Part II</i>.<br>He is late. Everyone in this story is late.</p>'
  + '<div class="fin">FIN</div><div class="by" style="margin-bottom:45vh">CAUGHT BY JK</div>';
const roll = document.getElementById('roll');
roll.innerHTML = html;

// ---- the roll: synced to the song, with drag / wheel to scrub ----
const song = new Audio('song.mp3'); song.loop = false; song.preload = 'auto'; song.volume = .8;
const SONG_LEN = 337.37;            // seconds; the roll lasts as long as the song
const LEAD = 4;                     // seconds before the first line enters
let muted = false, started = false, extra = 0, clock0 = 0, lastNow = 0;
try { muted = localStorage.getItem('credits-muted') === '1'; } catch (e) {}
const muteBtn = document.getElementById('mute'), againBtn = document.getElementById('again');
function showMute() { muteBtn.textContent = muted ? 'SOUND OFF' : 'SOUND ON'; song.muted = muted; }
showMute();
muteBtn.onclick = () => { muted = !muted; showMute(); try { localStorage.setItem('credits-muted', muted ? '1' : '0'); } catch (e) {} };

function songTime() {                // song position, or a clock if the song could not play
  if (!song.paused && isFinite(song.currentTime) && song.currentTime > 0) return song.currentTime;
  return started ? (performance.now() - clock0) / 1000 : 0;
}
function distance() { return roll.offsetHeight + innerHeight; }
function frame(now) {
  lastNow = now;
  const vh = innerHeight, total = distance();
  const speed = total / (SONG_LEN - LEAD - 2);
  let y = vh - Math.max(0, songTime() - LEAD) * speed - extra;
  y = Math.min(vh, Math.max(-roll.offsetHeight, y));
  roll.style.transform = `translate(-50%, ${y}px)`;
  if (started && y <= -roll.offsetHeight + vh * .5) againBtn.style.display = 'block';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function begin() {
  started = true; extra = 0; clock0 = performance.now();
  song.currentTime = 0; showMute();
  song.play().catch(() => {});
  document.getElementById('start').classList.add('gone');
  const v = document.getElementById('bg'); v.play().catch(() => {});
  againBtn.style.display = 'none';
}
document.getElementById('play').onclick = begin;
againBtn.onclick = begin;
song.addEventListener('ended', () => { clock0 = performance.now() - SONG_LEN * 1000; });

// scrub: wheel and drag move the roll; it keeps rolling from there
addEventListener('wheel', e => { if (started) extra += e.deltaY * .6; }, { passive: true });
let dragY = null;
addEventListener('pointerdown', e => { if (started && e.target.tagName !== 'BUTTON') dragY = e.clientY; });
addEventListener('pointermove', e => { if (dragY !== null) { extra += dragY - e.clientY; dragY = e.clientY; } });
addEventListener('pointerup', () => dragY = null);
addEventListener('pointercancel', () => dragY = null);
addEventListener('keydown', e => {
  if (!started) return;
  if (e.key === 'ArrowDown' || e.key === 'PageDown') extra += e.key === 'PageDown' ? innerHeight * .8 : 60;
  if (e.key === 'ArrowUp' || e.key === 'PageUp') extra -= e.key === 'PageUp' ? innerHeight * .8 : 60;
});

window.__credits = { state: () => ({ started, t: songTime(), extra, h: roll.offsetHeight }), seek: s => { if (!song.paused) song.currentTime = s; else clock0 = performance.now() - s * 1000; started = true; document.getElementById('start').classList.add('gone'); } };
</script>
