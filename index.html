<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>12.18</title>
<meta name="description" content="12.18">
<meta name="theme-color" content="#050000">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #050000; color: #ff2a1a; font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Courier New", monospace; overflow: hidden; display: flex; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; }
  /* a slow red breath behind everything, and a hard pulse on every second */
  .glow { position: fixed; inset: -20%; background: radial-gradient(60% 45% at 50% 50%, rgba(255, 20, 10, .20), rgba(120, 0, 0, .08) 45%, transparent 72%); animation: breathe 6s ease-in-out infinite; }
  .beat { position: fixed; inset: 0; background: radial-gradient(70% 55% at 50% 50%, rgba(255, 30, 15, .16), transparent 70%); opacity: 0; }
  .beat.go { animation: beat 1s ease-out; }
  .lines { position: fixed; inset: 0; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .34) 0 1px, transparent 1px 3px); pointer-events: none; mix-blend-mode: multiply; }
  .vig { position: fixed; inset: 0; background: radial-gradient(110% 90% at 50% 50%, transparent 38%, rgba(0, 0, 0, .92) 100%); pointer-events: none; }
  main { position: relative; width: 100%; padding: 0 3vw; text-align: center; }
  .date { font-size: clamp(12px, 2.2vw, 22px); letter-spacing: .7em; padding-left: .7em; color: #8a140c; margin-bottom: 4vh; }
  .clock { display: flex; justify-content: center; align-items: flex-start; gap: 1.2vw; font-variant-numeric: tabular-nums; font-weight: 700; line-height: .9; text-shadow: 0 0 .06em #ff2a1a, 0 0 .35em rgba(255, 30, 10, .65), 0 0 1.1em rgba(255, 0, 0, .35); }
  .unit { display: flex; flex-direction: column; align-items: center; }
  .num { font-size: clamp(44px, 13.6vw, 250px); letter-spacing: -.04em; }
  .sep { font-size: clamp(30px, 9vw, 160px); color: #a3150b; padding-top: .12em; animation: blink 1s steps(1) infinite; }
  .lab { margin-top: 2.2vh; font-size: clamp(9px, 1.25vw, 15px); font-weight: 400; letter-spacing: .5em; padding-left: .5em; color: #7a120a; text-shadow: none; }
  .ms { margin-top: 5vh; font-size: clamp(16px, 3.4vw, 46px); letter-spacing: .28em; padding-left: .28em; color: #b3190e; font-variant-numeric: tabular-nums; text-shadow: 0 0 .5em rgba(255, 20, 0, .5); }
  .bar { margin: 5vh auto 0; width: min(86vw, 1100px); height: 3px; background: #2a0503; position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: #ff2a1a; box-shadow: 0 0 12px #ff2a1a; width: 100%; }
  body.last .num, body.last .ms { animation: shake .18s linear infinite; }
  body.zero { animation: flash .5s steps(1) infinite; }
  body.zero .sep { animation: none; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
  @keyframes beat { 0% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: .18; } }
  @keyframes shake { 0% { transform: translate(0, 0); } 25% { transform: translate(-1px, 1px); } 50% { transform: translate(1px, -1px); } 75% { transform: translate(-1px, -1px); } 100% { transform: translate(0, 0); } }
  @keyframes flash { 0% { background: #050000; } 50% { background: #3d0300; } }
  @media (max-width: 640px) and (orientation: portrait) {
    .clock { flex-wrap: wrap; gap: 0 3vw; row-gap: 3vh; } .sep { display: none; } .unit { width: 42vw; } .num { font-size: 34vw; }
  }
  @media (prefers-reduced-motion: reduce) { .glow, .sep, body.last .num, body.last .ms, body.zero { animation: none; } .beat.go { animation: none; } }
</style>
</head>
<body>
<div class="glow"></div><div class="beat" id="beat"></div>
<main>
  <div class="date">12 . 18</div>
  <div class="clock" role="timer" aria-live="off" id="clock" aria-label="Countdown to December 18">
    <div class="unit"><span class="num" id="d">00</span><span class="lab">days</span></div><span class="sep">:</span>
    <div class="unit"><span class="num" id="h">00</span><span class="lab">hours</span></div><span class="sep">:</span>
    <div class="unit"><span class="num" id="m">00</span><span class="lab">minutes</span></div><span class="sep">:</span>
    <div class="unit"><span class="num" id="s">00</span><span class="lab">seconds</span></div>
  </div>
  <div class="ms" id="ms">000</div>
  <div class="bar"><i id="bar"></i></div>
</main>
<div class="lines"></div><div class="vig"></div>
<script>
// Counts down to the start of December 18 (midnight on the visitor's own clock). After the day has passed it counts to
// the next December 18. The bar is how much of the wait is left, measured from November 22, 2026, when this went up.
(function () {
  var now = new Date(), y = now.getFullYear(), end = new Date(y, 11, 18, 0, 0, 0, 0);
  if (now - end > 864e5) end = new Date(y + 1, 11, 18, 0, 0, 0, 0);
  var start = new Date(end.getFullYear(), 10, 22, 0, 0, 0, 0), total = end - start;
  var $ = function (i) { return document.getElementById(i); }, d = $('d'), h = $('h'), m = $('m'), s = $('s'), ms = $('ms'), bar = $('bar'), beat = $('beat'), lastS = -1;
  function p(n, w) { n = String(n); while (n.length < w) n = '0' + n; return n; }
  function tick() {
    var left = Math.max(0, end - Date.now()), sec = Math.floor(left / 1000);
    ms.textContent = p(left % 1000, 3);
    if (sec !== lastS) {
      lastS = sec;
      d.textContent = p(Math.floor(sec / 86400), 2); h.textContent = p(Math.floor(sec / 3600) % 24, 2); m.textContent = p(Math.floor(sec / 60) % 60, 2); s.textContent = p(sec % 60, 2);
      bar.style.width = Math.max(0, Math.min(100, left / total * 100)).toFixed(3) + '%';
      document.body.classList.toggle('last', left > 0 && left < 864e5); document.body.classList.toggle('zero', left === 0);
      document.title = left ? p(Math.floor(sec / 86400), 2) + ':' + p(Math.floor(sec / 3600) % 24, 2) + ':' + p(Math.floor(sec / 60) % 60, 2) + ':' + p(sec % 60, 2) : '00:00:00:00';
      beat.classList.remove('go'); void beat.offsetWidth; beat.classList.add('go');
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
<noscript><p style="text-align:center">12.18</p></noscript>
</body>
</html>
