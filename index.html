<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Turkey Fall</title>
<meta name="description" content="A soft toy turkey falls slowly through bubbles of holiday food. Choose one of ten holidays from around the world.">
<meta name="theme-color" content="#1b1420">
<style>
  :root { --ink: #fff6e6; --dim: rgba(255, 246, 230, .72); --card: rgba(20, 14, 24, .78); --line: rgba(255, 246, 230, .22); --hot: #ffb347; }
  html, body { height: 100%; margin: 0; background: #1b1420; overflow: hidden; color: var(--ink); font: 500 16px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 26px 26px 22px; max-width: 460px; width: 100%; text-align: center; backdrop-filter: blur(8px); box-sizing: border-box; }
  h1 { margin: 0 0 4px; font-size: 44px; line-height: 1.05; letter-spacing: .01em; }
  h2 { margin: 0 0 4px; font-size: 24px; }
  .sub { margin: 0 0 18px; color: var(--dim); }
  .pick { display: flex; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin: 0 0 18px; }
  .pick .ico { font-size: 38px; line-height: 1; }
  .pick b { display: block; font-size: 17px; } .pick span { color: var(--dim); font-size: 14px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: rgba(255, 246, 230, .08); border-radius: 999px; padding: 13px 24px; font-weight: 650; }
  .btn:hover { background: rgba(255, 246, 230, .16); }
  .btn.go { background: var(--hot); border-color: var(--hot); color: #2a1606; }
  .btn.go:hover { background: #ffc470; }
  .how { margin: 16px 0 0; color: var(--dim); font-size: 14px; }
  #settings .panel { max-width: 860px; max-height: 100%; text-align: left; display: flex; flex-direction: column; }
  #settings .grid { overflow: auto; flex: 1 1 auto; min-height: 0; padding: 2px; }
  #settings .foot { flex: none; }
  #settings .btn.go { min-width: 180px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 14px 0; }
  .card { text-align: left; border: 1px solid var(--line); background: rgba(255, 246, 230, .05); border-radius: 16px; padding: 12px 14px; display: grid; grid-template-columns: 44px 1fr; gap: 4px 10px; align-items: start; }
  .card:hover { background: rgba(255, 246, 230, .12); }
  .card[aria-pressed="true"] { border-color: var(--hot); background: rgba(255, 179, 71, .16); }
  .card { align-items: center; } .card .ico { font-size: 34px; line-height: 1.1; grid-row: span 3; }
  .card b { font-size: 16px; } .card i { font-style: normal; color: var(--hot); font-size: 13px; } .card span { color: var(--dim); font-size: 13.5px; line-height: 1.4; }
  #hud { position: fixed; left: 0; right: 0; top: 0; display: none; justify-content: space-between; align-items: flex-start; padding: max(12px, env(safe-area-inset-top)) 14px 0; pointer-events: none; }
  #hud .info { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; font-size: 14px; }
  #hud .info b { display: block; font-size: 15px; }
  #top { position: fixed; right: 14px; top: max(12px, env(safe-area-inset-top)); display: flex; gap: 8px; z-index: 5; }
  #top button { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; font-weight: 650; font-size: 14px; }
  #top button:hover { background: rgba(60, 44, 66, .9); }
  #hud { justify-content: flex-start !important; gap: 8px; z-index: 5; }
  #hud .info { max-width: calc(100% - 320px); }
  #switch { pointer-events: auto; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; font-weight: 650; font-size: 14px; }
  #switch:hover { background: rgba(60, 44, 66, .9); }
  @media (max-width: 520px) { #hud .info { display: none; } }
  #plate { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: none; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 8px 10px; pointer-events: none; max-width: calc(100% - 20px); box-sizing: border-box; }
  #plate div { width: 44px; text-align: center; font-size: 26px; line-height: 1.1; opacity: .3; filter: grayscale(1); transition: opacity .2s, filter .2s, transform .2s; }
  #plate div.got { opacity: 1; filter: none; } #plate div.pop { transform: scale(1.35); }
  #plate small { display: block; font-size: 11px; color: var(--dim); }
  #toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 9px 14px; font-size: 14.5px; max-width: min(520px, calc(100% - 28px)); text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; box-sizing: border-box; }
  #toast b { color: var(--hot); }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 4; }
  @media (max-width: 520px) { h1 { font-size: 36px; } .panel { padding: 20px 16px 16px; } #plate div { width: 38px; font-size: 22px; } }
</style>
</head>
<body>
<canvas id="c" aria-label="A soft toy falling slowly through bubbles"></canvas>

<div id="hud"><button id="switch" type="button" aria-label="Switch to the next holiday">Switch</button><div class="info"><b id="hName"></b><span id="hStat"></span></div></div>
<div id="top"><button id="gear" type="button" hidden>Settings</button><button id="mute" type="button" aria-pressed="false">Sound on</button></div>
<div id="plate" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<div id="fade" aria-hidden="true"></div>

<div class="screen" id="menu">
  <div class="panel">
    <h1>Turkey Fall</h1>
    <p class="sub">A slow fall through a sky of holiday dinner.</p>
    <div class="row"><button class="btn go" id="bStart" type="button">Play</button></div>
    <p class="how">Bump the bubbles to fill your plate. Drag to pull, or use the arrow keys.</p>
  </div>
</div>

<div class="screen" id="settings" hidden>
  <div class="panel">
    <h2>What kind of holiday would you like?</h2>
    <div class="grid" id="grid"></div>
    <div class="row foot"><button class="btn go" id="bGo" type="button">Play</button></div>
  </div>
</div>

<script>
// Turkey Fall. A rag doll falls slowly down an endless sky; bubbles rise to meet it. Bumping a food bubble pops it and
// puts that food on your plate; a full plate is a feast. Settings chooses the holiday: ten of them, each with its own
// doll, its own food, its own sky and its own way of falling. The notes about each holiday are in HOLIDAYS below.
'use strict';
const HOLIDAYS = [
  { id: 'turkey', ico: '🦃', name: 'American Thanksgiving', doll: 'The Turkey', when: 'United States · fourth Thursday of November',
    about: 'Families gather for roast turkey, stuffing, cranberry sauce and pumpkin pie. Not everyone celebrates: since 1970 many Native people have met in Plymouth that day for a National Day of Mourning.',
    sky: ['#2a1a2e', '#7a3b2e', '#e08a3c'], g: 500, drag: .982,
    food: [['🥧', 'Pumpkin pie', 'the end of nearly every Thanksgiving dinner'], ['🌽', 'Corn', 'grown here long before the Pilgrims arrived'], ['🍒', 'Cranberry sauce', 'sharp and red, beside the bird'], ['🥔', 'Mashed potatoes', 'with a well of gravy'], ['🍠', 'Sweet potatoes', 'often baked under marshmallows'], ['🍞', 'Stuffing', 'bread, onion and herbs']] },
  { id: 'canada', ico: '🍁', name: 'Canadian Thanksgiving', doll: 'The Pumpkin', when: 'Canada · second Monday of October',
    about: 'Six weeks earlier than the American one, because the harvest comes sooner in the north. A quieter long weekend: turkey, squash, pumpkin pie and butter tarts.',
    sky: ['#1c2436', '#8e3b2a', '#f0a54a'], g: 500, drag: .982,
    food: [['🍁', 'Maple syrup', 'boiled down from spring sap'], ['🧈', 'Butter tart', 'a small pastry of butter, sugar and egg'], ['🥧', 'Pumpkin pie', 'spiced, with whipped cream'], ['🦃', 'Roast turkey', 'the same bird, a month and a half early'], ['🥕', 'Roast roots', 'carrots, parsnips and squash'], ['🍎', 'Apples', 'picked in the weeks before']] },
  { id: 'germany', ico: '🌾', name: 'Erntedankfest', doll: 'The Wheat Sheaf', when: 'Germany · usually the first Sunday of October',
    about: 'A church harvest festival, not a big family dinner. Altars are piled with fruit, grain and bread, and a crown woven from ears of grain is carried through the village.',
    sky: ['#1f2a22', '#5c6b2e', '#e2c15a'], g: 500, drag: .982,
    food: [['🌾', 'Grain', 'wheat, rye, barley and oats woven into the harvest crown'], ['🍞', 'Bread', 'baked from the new flour and laid on the altar'], ['🍎', 'Apples', 'from the orchard baskets'], ['🍇', 'Grapes', 'the wine harvest ends about now'], ['🎃', 'Pumpkin', 'heaped by the church door'], ['🥔', 'Potatoes', 'the last crop out of the ground']] },
  { id: 'japan', ico: '🍚', name: 'Kinrō Kansha no Hi', doll: 'The Rice Ball', when: 'Japan · 23 November',
    about: 'Labour Thanksgiving Day. It grew out of Niiname-sai, the ancient rite of offering the first new rice. Today it thanks people for their work. There is no feast and no turkey: a quiet meal of rice, fish and tea.',
    sky: ['#161c2e', '#3e4a6e', '#d98a7a'], g: 500, drag: .982,
    food: [['🍚', 'New rice', 'the first rice of the year, offered before it is eaten'], ['🐟', 'Grilled fish', 'with salt, beside the rice'], ['🍵', 'Green tea', 'to finish'], ['🍙', 'Onigiri', 'rice pressed into a ball by hand'], ['🍠', 'Roast sweet potato', 'sold hot from carts in autumn'], ['🌰', 'Chestnuts', 'steamed in with the rice']] },
  { id: 'korea', ico: '🌕', name: 'Chuseok', doll: 'The Songpyeon', when: 'Korea · 15th day of the 8th lunar month',
    about: 'Three days when the whole country travels home. Families honour their ancestors, visit graves and share the new harvest under the full moon.',
    sky: ['#141a33', '#3b3f7a', '#e7b76a'], g: 500, drag: .982,
    food: [['🥟', 'Songpyeon', 'half-moon rice cakes steamed on pine needles'], ['🍐', 'Pears', 'big and round, set on the ancestors’ table'], ['🌰', 'Chestnuts', 'peeled and stacked high'], ['🥞', 'Jeon', 'savoury pancakes fried the day before'], ['🍚', 'New rice', 'from this year’s harvest'], ['🍶', 'Rice wine', 'poured first for the ancestors']] },
  { id: 'china', ico: '🥮', name: 'Mid-Autumn Festival', doll: 'The Jade Rabbit', when: 'China and much of East Asia · the same full moon as Chuseok',
    about: 'Families come together to look at the moon, light lanterns and share mooncakes. In the story a rabbit lives on the moon, pounding medicine.',
    sky: ['#0e1430', '#2a2f6b', '#c9a54a'], g: 460, drag: .982,
    food: [['🥮', 'Mooncake', 'cut in wedges, one for each person'], ['🍵', 'Tea', 'to go with something that rich'], ['🏮', 'Lantern', 'carried by children after dark'], ['🍊', 'Pomelo', 'peeled and shared; the rind makes a hat'], ['🦆', 'Duck', 'the dinner in many regions'], ['🌕', 'The moon', 'the reason everyone is outside']] },
  { id: 'ghana', ico: '🥁', name: 'Homowo', doll: 'The Corn Cob', when: 'Ghana · the Ga people, around August',
    about: 'The name means hooting at hunger. It remembers a famine that ended in a great harvest. Chiefs sprinkle kpokpoi through the streets, and families argue, forgive and eat.',
    sky: ['#1f1a12', '#7a4a1e', '#e9b23c'], g: 500, drag: .982,
    food: [['🌽', 'Kpokpoi', 'steamed corn meal, sprinkled for the ancestors'], ['🥣', 'Palm nut soup', 'red and thick, poured over the kpokpoi'], ['🐟', 'Smoked fish', 'in the soup'], ['🥁', 'Drums', 'silent for a month before, loud now'], ['🍠', 'Yam', 'the other harvest'], ['🌴', 'Palm fruit', 'pounded for the soup']] },
  { id: 'india', ico: '☀️', name: 'Pongal', doll: 'The Pongal Pot', when: 'Tamil Nadu, India · four days in mid-January',
    about: 'New rice is boiled with milk and jaggery until the pot overflows, and everyone shouts “Pongalo Pongal!” Thanks go to the sun, and the next day to the cattle.',
    sky: ['#2b1730', '#b0452a', '#f6c445'], g: 500, drag: .982,
    food: [['🍚', 'Sweet pongal', 'rice, milk and jaggery, boiled until it spills over'], ['🥛', 'Milk', 'it has to overflow: that is the luck'], ['🎋', 'Sugarcane', 'tall stalks tied by the door'], ['🥥', 'Coconut', 'cracked as an offering'], ['🍌', 'Banana', 'the leaf is the plate'], ['☀️', 'The sun', 'Pongal is cooked outdoors, facing it']] },
  { id: 'crab', ico: '🦀', name: 'The King Crab’s Day Off', doll: 'King Crab', when: 'The cold sea floor · whenever he likes',
    about: 'Not a country. The king crab is thankful for one thing: today he is a guest and not the dinner. He falls sideways and bounces well.',
    sky: ['#06141f', '#0d3b52', '#2aa3a0'], g: 430, drag: .978,
    food: [['🧈', 'Butter', 'a close call'], ['🍋', 'Lemon', 'another close call'], ['🧄', 'Garlic', 'he does not like where this is going'], ['🦪', 'Oyster', 'a neighbour'], ['🦐', 'Shrimp', 'a cousin, more or less'], ['🐚', 'A nice shell', 'for the collection']] },
  { id: 'space', ico: '🧑‍🚀', name: 'Thanksgiving in Orbit', doll: 'Space Man', when: 'The Space Station · since 2000',
    about: 'Astronauts have kept Thanksgiving in orbit since the first station crew. Dinner comes in pouches: smoked turkey, candied yams, green beans and mushrooms, warmed up or mixed with water. Everything falls slowly here.',
    sky: ['#03040c', '#0c1030', '#2a2360'], g: 190, drag: .9885, stars: true,
    food: [['🦃', 'Smoked turkey', 'sealed in a foil pouch'], ['🍠', 'Candied yams', 'heated in the pouch'], ['🥫', 'Green beans', 'freeze-dried: add water'], ['🍄', 'Mushrooms', 'also freeze-dried'], ['🧃', 'A drink bag', 'with a straw, so it stays put'], ['⭐', 'The view', 'sixteen sunrises a day']] }
];

// what each card says on the selection screen: where and when, then one short line
const SHORT = { turkey: ['USA · late November', 'Turkey, stuffing and pumpkin pie.'], canada: ['Canada · October', 'An earlier, quieter turkey dinner.'], germany: ['Germany · October', 'A church festival with a crown of grain.'],
  japan: ['Japan · 23 November', 'Thanks for work and the new rice.'], korea: ['Korea · autumn full moon', 'Everyone goes home for rice cakes.'], china: ['East Asia · autumn full moon', 'Mooncakes and lanterns under the moon.'],
  ghana: ['Ghana · August', 'The Ga people hoot at hunger.'], india: ['Tamil Nadu · January', 'Sweet rice boiled until it overflows.'], crab: ['The sea floor', 'Today he is a guest, not dinner.'], space: ['In orbit', 'Dinner in pouches, falling slowly.'] };
const $ = (id) => document.getElementById(id), cv = $('c'), ctx = cv.getContext('2d');
let Wd = 0, Hd = 0, dpr = 1, SW = 300;
function resize() { dpr = Math.min(devicePixelRatio || 1, 2); Wd = innerWidth; Hd = innerHeight; cv.width = Math.round(Wd * dpr); cv.height = Math.round(Hd * dpr); SW = Math.min(Wd, 760) / 2; }
addEventListener('resize', resize); resize();
const rand = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.min(b, Math.max(a, v));
let sel = 0; try { const s = localStorage.getItem('turkeyfall.holiday'); const i = HOLIDAYS.findIndex(h => h.id === s); if (i >= 0) sel = i; } catch (e) {}
let HD = HOLIDAYS[sel], mode = 'menu';

// ---- the doll: eleven points held together by sticks
const HEAD = 0, NECK = 1, PELV = 2, LE = 3, LH = 4, RE = 5, RH = 6, LK = 7, LF = 8, RK = 9, RF = 10;
let pts = [], sticks = [], mins = [];
function makeDoll(x, y) { const P = (dx, dy, r) => ({ x: x + dx, y: y + dy, px: x + dx, py: y + dy, r });
  pts = [P(0, -62, 15), P(0, -44, 7), P(0, 4, 12), P(-22, -34, 7), P(-40, -22, 8), P(22, -34, 7), P(40, -22, 8), P(-10, 30, 7), P(-12, 56, 8), P(10, 30, 7), P(12, 56, 8)];
  const S = (a, b) => sticks.push([a, b, Math.hypot(pts[a].x - pts[b].x, pts[a].y - pts[b].y)]); sticks = [];
  S(HEAD, NECK); S(NECK, PELV); S(NECK, LE); S(LE, LH); S(NECK, RE); S(RE, RH); S(PELV, LK); S(LK, LF); S(PELV, RK); S(RK, RF);
  mins = [[HEAD, PELV, 62], [LE, RE, 22], [LK, RK, 14], [LE, PELV, 30], [RE, PELV, 30], [LK, NECK, 50], [RK, NECK, 50], [LH, HEAD, 16], [RH, HEAD, 16], [LF, PELV, 26], [RF, PELV, 26]];
  for (const p of pts) { p.px -= rand(-1.5, 1.5); } }

// ---- bubbles
let bubbles = [], bits = [], nextY = 0, camY = 0, plate = [], feasts = 0, popped = 0, ouch = 0, time = 0;
function spawn(y) { const k = Math.random(), kind = k < .52 ? 'food' : k < .86 ? 'soap' : 'jelly', r = kind === 'food' ? rand(26, 36) : kind === 'soap' ? rand(14, 30) : rand(46, 70);
  let fi = (Math.random() * 6) | 0; if (kind === 'food' && Math.random() < .5) { const need = plate.map((n, i) => n ? -1 : i).filter(i => i >= 0); if (need.length) fi = need[(Math.random() * need.length) | 0]; }
  bubbles.push({ x: rand(-SW + r, SW - r), y, r, kind, fi, vx: 0, vy: 0, rise: rand(16, 44) * (kind === 'jelly' ? .6 : 1), ph: rand(0, 6.28), hp: kind === 'soap' ? 2 : 1, cool: 0, hue: rand(0, 360) }); }
function reset() { makeDoll(0, 0); bubbles = []; bits = []; nextY = 260; camY = -Hd * .38; plate = [0, 0, 0, 0, 0, 0]; feasts = 0; popped = 0; drawPlate(); }

// ---- sound
// THE SONG is song.mp3 beside this page: it starts with Start, loops, and the button at the top right mutes everything.
let muted = false; try { muted = localStorage.getItem('turkeyfall.muted') === '1'; } catch (e) {}
const music = new Audio('song.mp3'); music.loop = true; music.preload = 'auto'; music.volume = .7; music.muted = muted;
function playMusic() { if (!muted) music.play().catch(() => {}); }
function showMute() { const b = $('mute'); b.textContent = muted ? 'Sound off' : 'Sound on'; b.setAttribute('aria-pressed', muted); }
$('mute').onclick = () => { muted = !muted; music.muted = muted; try { localStorage.setItem('turkeyfall.muted', muted ? '1' : '0'); } catch (e) {} showMute(); if (muted) music.pause(); else if (mode === 'play') playMusic(); }; showMute();
function pop() {}   // no sound effects: the song is the only sound

// ---- hands on: drag pulls the nearest part of the doll; arrow keys push it sideways
let grab = -1, gx = 0, gy = 0, keyX = 0; const keys = {};
const toWorld = (e) => [e.clientX - Wd / 2, e.clientY + camY];
cv.addEventListener('pointerdown', (e) => { if (mode !== 'play') return; [gx, gy] = toWorld(e); let best = 1e9; grab = PELV; pts.forEach((p, i) => { const d = Math.hypot(p.x - gx, p.y - gy); if (d < best) { best = d; grab = i; } }); try { cv.setPointerCapture(e.pointerId); } catch (er) {} e.preventDefault(); });
cv.addEventListener('pointermove', (e) => { if (grab >= 0) [gx, gy] = toWorld(e); });
const drop = () => { grab = -1; }; cv.addEventListener('pointerup', drop); cv.addEventListener('pointercancel', drop);
addEventListener('keydown', (e) => { keys[e.key] = 1; if (e.key === 'Escape' && mode === 'play') openMenu(); if (mode === 'play' && e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', (e) => { keys[e.key] = 0; });

// ---- one small step of the world
const H = 1 / 480, TIME_SCALE = .25;      // the whole world runs at a quarter speed: a long, slow fall
function step() { const g = HD.g * H * H, d = Math.pow(HD.drag, H * 120), bd = Math.pow(.985, H * 120); keyX = ((keys.ArrowRight || keys.d || keys.D) ? 1 : 0) - ((keys.ArrowLeft || keys.a || keys.A) ? 1 : 0);
  const ky = ((keys.ArrowDown || keys.s || keys.S) ? 1 : 0) - ((keys.ArrowUp || keys.w || keys.W) ? 1 : 0);
  for (const p of pts) { const vx = (p.x - p.px) * d, vy = (p.y - p.py) * d; p.px = p.x; p.py = p.y; p.x += vx + keyX * 620 * H * H; p.y += vy + g + ky * 260 * H * H; }
  // a drag is a soft tug, never a tow: a small push toward the finger, weaker than the fall itself, shared by the whole doll
  if (grab >= 0 && mode === 'play') { const p = pts[grab], dx = gx - p.x, dy = gy - p.y, L = Math.hypot(dx, dy) || 1, a = Math.min(L * 2.9, 350) * H * H, ax = dx / L * a, ay = dy / L * a;
    for (const o of pts) { o.x += ax * .55; o.y += ay * .55; } p.x += ax * .6; p.y += ay * .6; }
  for (let it = 0; it < 4; it++) {
    for (const [a, b, len] of sticks) { const A = pts[a], B = pts[b], dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1e-6, k = (L - len) / L * .5; A.x += dx * k; A.y += dy * k; B.x -= dx * k; B.y -= dy * k; }
    for (const [a, b, len] of mins) { const A = pts[a], B = pts[b], dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1e-6; if (L < len) { const k = (L - len) / L * .25; A.x += dx * k; A.y += dy * k; B.x -= dx * k; B.y -= dy * k; } }
    for (const p of pts) { if (p.x < -SW + p.r) { p.x = -SW + p.r; p.px = p.x - (p.px - p.x) * .5; } else if (p.x > SW - p.r) { p.x = SW - p.r; p.px = p.x - (p.px - p.x) * .5; } } }
  for (const b of bubbles) { b.y += (b.vy - b.rise) * H; b.x += (b.vx + Math.sin(time * 1.3 + b.ph) * 14) * H; b.vx *= bd; b.vy *= bd; b.cool -= H; b.x = clamp(b.x, -SW + b.r, SW - b.r);
    if (b.dead) continue;

      const L = Math.sqrt(d2) || 1e-6, nx = dx / L, ny = dy / L, ov = rr - L; p.x += nx * ov * .8; p.y += ny * ov * .8; b.x -= nx * ov * .2; b.y -= ny * ov * .2;
