<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Dust Sphere</title>
<meta name="description" content="An island at dusk, and over it a huge spinning sphere of dust with a band playing inside.">
<meta name="theme-color" content="#000000">
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #d8d2c8; font: 500 17px/1.5 "Segoe UI", system-ui, sans-serif; }
  #play { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; font: 600 15px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: #f1e6d4; background: rgba(10, 8, 6, .6); border: 1px solid rgba(241, 230, 212, .5); border-radius: 999px; padding: 16px 30px; cursor: pointer; }
  #play:hover { background: rgba(40, 30, 20, .75); }
  #play:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="An island at dusk under a huge spinning sphere of dust, with a band playing inside it"></canvas>
<button id="play" type="button">Play</button>
<div id="msg">This scene needs WebGL 2, and this browser does not have it turned on.</div>
<script type="module">
// The Dust Sphere. An island, a rough sea, a storm sky, and a sphere of dust 116 units across spinning over the island
// with a band playing inside it. Drawn in four steps each frame:
//   1. everything solid (sky, sea, island, palms, flying debris, the stage and band) into a picture with its depth
//   2. the dust itself, marched through as a real volume at half size, stopping at whatever solid thing is in the way
//   3. the picture and the dust put together, then loose dust specks on top
//   4. glow around bright things, film grain, the dark edges, the black bars and the fade from black
// THE SONG is song.mp3 beside this page. The scene waits for a press of Play (browsers do not let sound start by itself),
// then runs on the song's clock; the lights, the lightning, the camera shake and the swell of the dust follow its sound.
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';
const SONG = 'song.mp3', BPM = 90;        // the band's sway; the lights and lightning follow the sound itself
const LENGTH = 291.87, INTRO = 20, LOUD = 88, OUTRO = 260;   // the song in seconds: its length, when it kicks in, when it gets loud, when it winds down

const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' }); if (!renderer.capabilities.isWebGL2) throw 0; }
catch (e) { document.getElementById('msg').style.display = 'flex'; throw e; }
renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.autoClear = false;
const HDR = renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float') ? THREE.HalfFloatType : THREE.UnsignedByteType;

// ---- random numbers: one small texture for the GPU (red is green shifted, which gives 3D noise from one read)
let seed = 4242; const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const NS = 256, G = new Uint8Array(NS * NS), nd = new Uint8Array(NS * NS * 4);
for (let i = 0; i < NS * NS; i++) G[i] = (rnd() * 256) | 0;
for (let y = 0; y < NS; y++) for (let x = 0; x < NS; x++) { const i = (y * NS + x) * 4; nd[i + 1] = G[y * NS + x]; nd[i] = G[((y + 17) & 255) * NS + ((x + 37) & 255)]; nd[i + 2] = 0; nd[i + 3] = 255; }
const noiseTex = new THREE.DataTexture(nd, NS, NS, THREE.RGBAFormat); noiseTex.wrapS = noiseTex.wrapT = THREE.RepeatWrapping; noiseTex.magFilter = noiseTex.minFilter = THREE.LinearFilter; noiseTex.needsUpdate = true;
const vn = (x, y) => { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy), g = (a, b) => G[(b & 255) * NS + (a & 255)] / 255;
  const a = g(ix, iy), b = g(ix + 1, iy), c = g(ix, iy + 1), d = g(ix + 1, iy + 1); return a + (b - a) * ux + (c - a + (a - b - c + d) * ux) * uy; };
const fbmJ = (x, y, n) => { let s = 0, a = .5; for (let i = 0; i < n; i++) { s += a * vn(x, y); x = x * 2.03 + 17.3; y = y * 2.03 + 9.1; a *= .5; } return s; };
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v)), mix = (a, b, t) => a + (b - a) * t;

// ---- the island's shape (script side; the sea reads it from a texture)
function islandH(x, z) { const r = Math.hypot(x, z), a = Math.atan2(z, x), rim = 232 + 56 * (fbmJ(x * .004 + 3, z * .004 + 7, 3) - .5) + 18 * Math.sin(a * 3 + 1) + 10 * Math.sin(a * 5 + 2);
  const t = 1 - r / rim; let h = t > 0 ? 26 * Math.pow(t, .75) : 60 * t; h += (fbmJ(x * .012, z * .012, 4) - .5) * 14 * sstep(0, .25, t);
  const pl = sstep(95, 45, r); return h * (1 - pl) + 9 * pl; }
const ISL = 1200, IN = 256, islData = new Float32Array(IN * IN * 4);
for (let j = 0; j < IN; j++) for (let i = 0; i < IN; i++) { const k = (j * IN + i) * 4; islData[k] = islandH((i + .5) / IN * ISL - ISL / 2, (j + .5) / IN * ISL - ISL / 2); islData[k + 3] = 1; }
const islTex = new THREE.DataTexture(islData, IN, IN, THREE.RGBAFormat, THREE.FloatType); islTex.magFilter = islTex.minFilter = renderer.extensions.has('OES_texture_float_linear') ? THREE.LinearFilter : THREE.NearestFilter; islTex.needsUpdate = true;

const SUN = new THREE.Vector3(-.55, .2, -.62).normalize(), STAGE_Y = 9;
const U = { uNoise: { value: noiseTex }, uTime: { value: 0 }, uSun: { value: SUN }, uIsl: { value: islTex },
  uPulse: { value: 0 }, uL0: { value: new THREE.Vector3() }, uL1: { value: new THREE.Vector3() }, uL2: { value: new THREE.Vector3() }, uFlash: { value: 0 }, uFlashPos: { value: new THREE.Vector3(0, 60, 0) } };

const COMMON = `
uniform sampler2D uNoise; uniform sampler2D uIsl; uniform float uTime; uniform float uPulse; uniform vec3 uSun; uniform vec3 uL0, uL1, uL2; uniform float uFlash; uniform vec3 uFlashPos;
const vec3 C=vec3(0.,62.,0.); const float R=58.;
const vec3 SUNC=vec3(1.,.50,.22)*2.7, AMB=vec3(.10,.135,.22);
const vec3 LP0=vec3(-9.,26.,-4.), LP1=vec3(9.,26.,-4.), LP2=vec3(0.,29.,6.);
float n3(vec3 x){ vec3 p=floor(x), f=fract(x); f=f*f*(3.-2.*f); vec2 uv=(p.xy+vec2(37.,17.)*p.z)+f.xy; vec2 rg=textureLod(uNoise,(uv+.5)/256.,0.).yx; return mix(rg.x,rg.y,f.z); }
float n2(vec2 x){ vec2 p=floor(x), f=fract(x); f=f*f*(3.-2.*f); return textureLod(uNoise,(p+f+.5)/256.,0.).y; }
float fbm2(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*n2(p); p=vec2(1.62*p.x-1.21*p.y, 1.21*p.x+1.62*p.y)+vec2(17.3,9.1); a*=.5; } return s; }
float fbm3(vec3 p){ return .5*n3(p)+.25*n3(p*2.02+7.1)+.125*n3(p*4.1+3.3); }
vec3 rotY(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(c*p.x-s*p.z, p.y, s*p.x+c*p.z); }
float islH(vec2 p){ vec2 uv=p/1200.+.5; if(uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.) return -60.; return textureLod(uIsl,uv,0.).x; }
// the sphere blocks the low sun: everything behind it sits in a long soft shadow
float sphShadow(vec3 p){ vec3 oc=p-C; float b=dot(oc,uSun); if(b>0.) return 1.; return mix(.22,1.,smoothstep(R*.75,R*1.3,length(oc-uSun*b))); }
vec3 skyBase(vec3 d){ float y=max(d.y,0.), s=max(dot(d,uSun),0.);
  vec3 hor=mix(vec3(.085,.105,.17), vec3(1.0,.40,.13), pow(s,3.)); vec3 c=mix(hor, vec3(.014,.021,.045), pow(y,.36));
  return c+vec3(1.,.40,.12)*pow(s,30.)*.8; }
vec3 fogged(vec3 col, vec3 wp){ vec3 v=wp-cameraPosition; float dist=length(v); vec3 d=v/dist; return mix(col, skyBase(normalize(vec3(d.x,.015,d.z))), 1.-exp(-dist*.00024)); }
`;

const scene = new THREE.Scene(), fx = new THREE.Scene(), camera = new THREE.PerspectiveCamera(45, 1, 1, 12000);

// ---- sky: dusk, a low sun, and storm cloud winding around the island
{ const m = new THREE.Mesh(new THREE.SphereGeometry(9000, 24, 16), new THREE.ShaderMaterial({ uniforms: U, side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*viewMatrix*vec4(position+cameraPosition,1.); gl_Position.z=gl_Position.w*.99995; }`,
    fragmentShader: COMMON + `varying vec3 vDir;
    void main(){ vec3 d=normalize(vDir); vec3 c=skyBase(normalize(vec3(d.x,max(d.y,0.),d.z))); float s=max(dot(d,uSun),0.), cov=0.;
      if(d.y>.004){ vec3 P=cameraPosition+d*((700.-cameraPosition.y)/d.y); float r=length(P.xz), ang=atan(P.z,P.x)-uTime*.03-520./(r+300.);
        vec2 sp=vec2(cos(ang),sin(ang))*r*.0042; float den=fbm2(sp)+.22*smoothstep(2200.,200.,r);
        cov=smoothstep(.40,.70,den)*smoothstep(0.,.10,d.y); float shade=clamp((den-fbm2(sp+uSun.xz*.35))*3.+.45,0.,1.);
        vec3 cl=mix(vec3(.018,.021,.034), vec3(.70,.30,.13), shade*(.06+pow(s,1.7))); cl+=vec3(1.,.36,.09)*pow(s,7.)*.7+vec3(.6,.7,1.)*uFlash*.05;
        c=mix(c, cl, cov); }
      c+=vec3(1.,.72,.42)*(smoothstep(.9992,.9997,s)*22.+pow(s,500.)*2.5)*(1.-cov*.92);
      gl_FragColor=vec4(c,1.); }` }));
  m.frustumCulled = false; m.renderOrder = -10; scene.add(m); }

// ---- sea: a grid that stays under the camera, lifted by the waves
let sea;
{ const pos = [], idx = [], RN = 170, SN = 96; for (let i = 0; i <= RN; i++) { const r = .32 * i * i; for (let j = 0; j < SN; j++) { const a = j / SN * 6.28318; pos.push(Math.cos(a) * r, 0, Math.sin(a) * r); } }
  for (let i = 0; i < RN; i++) for (let j = 0; j < SN; j++) { const a = i * SN + j, b = i * SN + (j + 1) % SN, c = a + SN, d = b + SN; idx.push(a, c, b, b, c, d); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  const WAVE = `float waveH(vec2 p){ float r=length(p), k=.18+.82*smoothstep(0.,14.,-islH(p));
      float h=1.5*sin(dot(p,vec2(.062,.031))+uTime*.9)+.95*sin(dot(p,vec2(-.04,.105))+uTime*1.25)+.55*sin(dot(p,vec2(.17,-.11))+uTime*1.8)+.3*sin(dot(p,vec2(.21,.30))+uTime*2.6)
        +.24*sin(dot(p,vec2(.55,.33))+uTime*3.4)+.17*sin(dot(p,vec2(-.42,.71))+uTime*4.1);
      return (h+.8*sin(r*.11-uTime*2.4)*smoothstep(800.,200.,r))*k; }`;
  sea = new THREE.Mesh(g, new THREE.ShaderMaterial({ side: THREE.DoubleSide, uniforms: { ...U, uOrigin: { value: new THREE.Vector2() } },
    vertexShader: COMMON + WAVE + `uniform vec2 uOrigin; varying vec3 vW; void main(){ vec2 p=position.xz+uOrigin; vW=vec3(p.x,waveH(p),p.y); gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.); }`,
    fragmentShader: COMMON + WAVE + `varying vec3 vW;
    void main(){ vec2 p=vW.xz; float e=.9, h0=waveH(p); vec3 N=normalize(vec3(h0-waveH(p+vec2(e,0.)), e, h0-waveH(p+vec2(0.,e))));
      float dist=length(cameraPosition-vW), nf=1./(1.+dist*.004); vec2 q=p*.9+uTime*vec2(1.2,.5); float a=n2(q);
      vec2 q2=p*.28+uTime*vec2(-.5,.7); float a2=n2(q2);
      N=normalize(N+vec3(a-n2(q+vec2(1.3,0.)),0.,a-n2(q+vec2(0.,1.3)))*1.0*nf+vec3(a2-n2(q2+vec2(1.2,0.)),0.,a2-n2(q2+vec2(0.,1.2)))*.8*(.3+.7*nf));
      vec3 V=normalize(cameraPosition-vW), Rr=reflect(-V,N); Rr.y=abs(Rr.y)+.03; Rr=normalize(Rr);
      float fres=min(.03+.97*pow(1.-max(dot(V,N),0.),5.),.74), depth=-islH(p), sh=sphShadow(vW), r=length(p);
      vec3 body=mix(vec3(.03,.21,.20), vec3(.008,.034,.058), 1.-exp(-max(depth,0.)*.05))*(.35+.65*sh);
      vec3 col=mix(body, skyBase(Rr)*(.8+.25*a2), fres)+SUNC*pow(max(dot(Rr,uSun),0.),90.)*1.6*sh;
      float foam=smoothstep(2.0,3.2,h0+fbm2(p*.35+uTime*.4)*1.7-.6)*.6;
      foam=max(foam, smoothstep(2.6,0.,depth+sin(depth*1.6-uTime*2.)*.6)*(.45+.55*fbm2(p*.6+uTime*.2)));
      foam=max(foam, smoothstep(.52,.78,fbm2(vec2(atan(p.y,p.x)*14.+r*.05+uTime*.8, r*.03)))*smoothstep(540.,235.,r)*.55);
      col=mix(col, vec3(.86,.88,.88)*(SUNC*.20*sh+AMB*2.1), foam);
      gl_FragColor=vec4(fogged(col,vW),1.); }` }));
  sea.frustumCulled = false; scene.add(sea); }

// ---- the island
{ const g = new THREE.PlaneGeometry(680, 680, 220, 220).rotateX(-Math.PI / 2), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, islandH(p.getX(i), p.getZ(i))); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.ShaderMaterial({ uniforms: U,
    vertexShader: `varying vec3 vW; varying vec3 vN; void main(){ vW=position; vN=normal; gl_Position=projectionMatrix*viewMatrix*vec4(position,1.); }`,
    fragmentShader: COMMON + `varying vec3 vW; varying vec3 vN;
    void main(){ if(vW.y<-2.5) discard; vec3 N=normalize(vN); float h=vW.y, slope=1.-N.y; vec2 p=vW.xz; float d1=fbm2(p*.5), d2=fbm2(p*.06), r=length(p);
      vec3 sand=mix(vec3(.60,.50,.34), vec3(.74,.65,.47), d1), grass=mix(vec3(.09,.17,.05), vec3(.24,.26,.08), d2), rock=mix(vec3(.19,.17,.15), vec3(.36,.32,.28), d1);
      vec3 col=mix(sand, grass, smoothstep(4.,8.,h+d2*4.)); col=mix(col, rock, smoothstep(.10,.28,slope)); col=mix(sand*.45, col, smoothstep(.2,1.7,h));
      float streak=fbm2(vec2(atan(p.y,p.x)*9.+r*.09+uTime*.35, r*.05));
      col=mix(col, vec3(.50,.39,.26)*(.55+.9*streak), smoothstep(160.,62.,r)*.88);
      vec3 lit=col*(SUNC*max(dot(N,uSun),0.)*sphShadow(vW)+AMB*(.5+.5*N.y)*1.3);
      vec3 dl=vW-(LP2-vec3(0.,14.,0.)); lit+=col*(uL0+uL1+uL2)*(22./(80.+dot(dl,dl)));
      gl_FragColor=vec4(fogged(lit,vW),1.); }` }))); }

// ---- palms, bent by the wind that circles the sphere
{ const pos = [], nor = [], col = [], aH = [], aF = [], H = 14, TS = 6, RS = 6;
  const ring = (i) => { const u = i / TS, y = u * H, rad = mix(.40, .22, u), ox = .9 * u * u; const out = []; for (let j = 0; j < RS; j++) { const a = j / RS * 6.28318; out.push([ox + Math.cos(a) * rad, y, Math.sin(a) * rad, Math.cos(a), Math.sin(a), u]); } return out; };
  const put = (v, c, flex) => { pos.push(v[0], v[1], v[2]); nor.push(v[3], .25, v[4]); col.push(c[0], c[1], c[2]); aH.push(v[5]); aF.push(flex); };
  for (let i = 0; i < TS; i++) { const a = ring(i), b = ring(i + 1), c = [.30 - i * .012, .21, .13]; for (let j = 0; j < RS; j++) { const k = (j + 1) % RS; put(a[j], c, 0); put(b[j], c, 0); put(a[k], c, 0); put(a[k], c, 0); put(b[j], c, 0); put(b[k], c, 0); } }
  for (let f = 0; f < 11; f++) { const ph = f / 11 * 6.28318 + (f % 2) * .3, dx = Math.cos(ph), dz = Math.sin(ph), px = -dz, pz = dx, len = 7 + (f % 3), lift = 1.4 + (f % 4) * .6, c = [.07 + .04 * (f % 3), .20 + .05 * (f % 2), .05];
    const at = (k) => { const u = k / 6, w = (.95 * Math.sin(Math.PI * Math.pow(u, .8)) + .08), x = .9 + dx * len * u, z = dz * len * u, y = H + lift * Math.sin(u * 2.2) - 4.2 * u * u; return [[x + px * w, y, z + pz * w, 0, 0, 1], [x - px * w, y, z - pz * w, 0, 0, 1], u]; };
    for (let k = 0; k < 6; k++) { const a = at(k), b = at(k + 1), P = (v, u) => { pos.push(v[0], v[1], v[2]); nor.push(0, 1, 0); col.push(c[0], c[1], c[2]); aH.push(1); aF.push(u); };
      P(a[0], a[2]); P(b[0], b[2]); P(a[1], a[2]); P(a[1], a[2]); P(b[0], b[2]); P(b[1], b[2]); } }
  const g = new THREE.InstancedBufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aH', new THREE.Float32BufferAttribute(aH, 1)); g.setAttribute('aF', new THREE.Float32BufferAttribute(aF, 1));
  const ip = [], irs = []; let tries = 0; while (ip.length < 170 * 3 && tries++ < 20000) { const a = rnd() * 6.28318, r = 72 + rnd() * 160, x = Math.cos(a) * r, z = Math.sin(a) * r, h = islandH(x, z); if (h < 2.2 || h > 17) continue; ip.push(x, h - .3, z); irs.push(rnd() * 6.28318, .75 + rnd() * .7); }
  g.setAttribute('iPos', new THREE.InstancedBufferAttribute(new Float32Array(ip), 3)); g.setAttribute('iRS', new THREE.InstancedBufferAttribute(new Float32Array(irs), 2)); g.instanceCount = ip.length / 3;
  const m = new THREE.Mesh(g, new THREE.ShaderMaterial({ uniforms: U, side: THREE.DoubleSide,
    vertexShader: COMMON + `attribute vec3 color; attribute float aH; attribute float aF; attribute vec3 iPos; attribute vec2 iRS; varying vec3 vW; varying vec3 vN; varying vec3 vC;
    void main(){ float c=cos(iRS.x), s=sin(iRS.x); vec3 p=vec3(c*position.x-s*position.z, position.y, s*position.x+c*position.z)*iRS.y; vN=vec3(c*normal.x-s*normal.z, normal.y, s*normal.x+c*normal.z);
      vec2 toC=-iPos.xz; float dist=length(toC); toC/=max(dist,1.); vec2 tang=vec2(toC.y,-toC.x);
      float str=.3+1.7*smoothstep(330.,80.,dist), gust=.75+.25*sin(uTime*2.3+iPos.x*.05)+.2*sin(uTime*5.1+iPos.z*.09);
      vec2 wind=(tang*.85+toC*.5)*str*gust; float hh=aH*aH;
      p.xz+=wind*hh*4.4*iRS.y; p.y-=length(wind)*hh*.9*iRS.y;
      p+=vec3(wind.x,-.35*length(wind),wind.y)*aF*aF*3.2*iRS.y; p.y+=sin(uTime*11.+aF*5.+iPos.x)*.35*aF;
      vW=iPos+p; vC=color; gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.); }`,
    fragmentShader: COMMON + `varying vec3 vW; varying vec3 vN; varying vec3 vC;
    void main(){ vec3 N=normalize(vN); float ndl=abs(dot(N,uSun))*.75+.25*max(uSun.y,0.); vec3 lit=vC*vec3(.75,.62,.6)*(SUNC*ndl*sphShadow(vW)+AMB*1.3); gl_FragColor=vec4(fogged(lit,vW),1.); }` }));
  m.frustumCulled = false; scene.add(m); }

// ---- debris torn loose and carried round the sphere
{ const g = new THREE.InstancedBufferGeometry().copy(new THREE.BoxGeometry(1, .12, .45)), n = 320, a = [], b = [];
  for (let i = 0; i < n; i++) { a.push(rnd(), rnd(), rnd(), .35 + rnd() * .5); const v = new THREE.Vector3(rnd() - .5, rnd() - .5, rnd() - .5).normalize(); b.push(v.x, v.y, v.z, .3 + rnd() * rnd() * 1.3); }
  g.setAttribute('iA', new THREE.InstancedBufferAttribute(new Float32Array(a), 4)); g.setAttribute('iB', new THREE.InstancedBufferAttribute(new Float32Array(b), 4)); g.instanceCount = n;
  const m = new THREE.Mesh(g, new THREE.ShaderMaterial({ uniforms: U,
    vertexShader: COMMON + `attribute vec4 iA; attribute vec4 iB; varying vec3 vW; varying vec3 vN; varying float vK;
    vec3 rod(vec3 v, vec3 k, float a){ return v*cos(a)+cross(k,v)*sin(a)+k*dot(k,v)*(1.-cos(a)); }
    void main(){ float ang=iA.z*6.28318+uTime*iA.w, ny=clamp(iA.y*1.9-.95,-.96,.96), hr=sqrt(1.-ny*ny);
      float rr=R*(1.02+.42*iA.x*iA.x)+sin(uTime*.7+iA.z*20.)*4.;
      vec3 ctr=C+vec3(cos(ang)*rr*hr, ny*rr+sin(uTime*.9+iA.z*9.)*4., sin(ang)*rr*hr); ctr.y=max(ctr.y, 3.);
      vec3 k=normalize(iB.xyz); float ta=uTime*(2.+3.*iA.x)+iA.z*30.;
      vec3 p=rod(position*iB.w*vec3(3.,1.,2.), k, ta); vN=rod(normal, k, ta); vW=ctr+p; vK=iA.x; gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.); }`,
    fragmentShader: COMMON + `varying vec3 vW; varying vec3 vN; varying float vK;
