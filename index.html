<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Have a nice weekend</title>
<meta name="description" content="A friendly A.I. waving hello. Have a nice weekend.">
<meta name="theme-color" content="#fbf6ea">
<style>
  :root { --paper: #fbf6ea; --ink: #33302b; --face: #ffd95e; --cheek: #ff9f8c; --grass: #7dbb6a; }
  @media (prefers-color-scheme: dark) { :root { --paper: #23211d; --ink: #f1ebdd; --face: #f2c94c; --cheek: #f08a78; --grass: #6aa659; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", cursive; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; overflow: hidden; }
  main { width: min(400px, 86vw); }
  h1 { margin: 0 0 4px; text-align: center; font-size: clamp(30px, 9vw, 46px); line-height: 1.15; font-weight: 700; transform: rotate(-2deg); }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .friend { animation: bob 3s ease-in-out infinite; }
  .arm { transform-origin: 284px 238px; animation: wave 1.3s ease-in-out infinite; }
  .eye { transform-origin: center; transform-box: fill-box; animation: blink 4.4s infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes wave { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(22deg); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @media (prefers-reduced-motion: reduce) { .friend, .eye { animation: none; } .arm { animation-duration: 3s; } }
</style>
</head>
<body>
<main>
  <h1>Have a nice weekend!</h1>
  <svg viewBox="0 0 400 420" role="img" aria-label="A smiling friend waving, drawn by hand">
    <defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter></defs>
    <g filter="url(#wobble)" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 392 q14 -22 26 0 q12 -26 26 0 M300 394 q12 -24 24 0 q14 -20 26 0" stroke="var(--grass)"/>
      <path d="M70 398 H340" stroke-width="4" opacity=".5"/>
      <g class="friend">
        <g class="arm">
          <path d="M284 238 Q330 218 346 160"/>
          <path d="M346 160 L328 140 M346 160 L348 132 M346 160 L366 144"/>
        </g>
        <path d="M116 238 Q72 262 62 312"/>
        <path d="M176 290 L168 392 L148 394 M224 290 L232 392 L252 394"/>
        <circle cx="200" cy="200" r="98" fill="var(--face)"/>
        <g stroke="none">
          <ellipse class="eye" cx="166" cy="180" rx="10" ry="15" fill="#33302b"/>
          <ellipse class="eye" cx="234" cy="180" rx="10" ry="15" fill="#33302b"/>
          <ellipse cx="136" cy="222" rx="16" ry="10" fill="var(--cheek)" opacity=".8"/>
          <ellipse cx="264" cy="222" rx="16" ry="10" fill="var(--cheek)" opacity=".8"/>
        </g>
        <path d="M152 224 Q200 280 248 224" stroke="#33302b"/>
      </g>
    </g>
  </svg>
</main>
</body>
</html>
